<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pxlpad Server</title>
    <script type="module" src="/src/main.ts" defer></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        background: #1a1a2e;
        color: #ddd;
        padding: 20px;
        min-height: 100vh;
      }
      h1 { font-size: 18px; margin-bottom: 16px; color: #fff; }
      .status-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }
      .status-card {
        background: #2a2a3e;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 14px;
      }
      .status-card .label {
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .status-card .value {
        font-size: 20px;
        font-weight: 600;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }
      .dot.green { background: #4caf50; }
      .dot.red { background: #f44336; }
      .dot.yellow { background: #ff9800; }
      .info {
        font-size: 12px;
        color: #666;
        margin-top: 16px;
        line-height: 1.6;
      }
      .info code {
        background: #2a2a3e;
        padding: 2px 6px;
        border-radius: 3px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <h1>Pxlpad Server</h1>
    <div class="status-grid">
      <div class="status-card">
        <div class="label">WebSocket</div>
        <div class="value"><span class="dot green"></span>Listening</div>
      </div>
      <div class="status-card">
        <div class="label">Port</div>
        <div class="value">9874</div>
      </div>
      <div class="status-card">
        <div class="label">Aseprite Extension</div>
        <div class="value" id="ext-status"><span class="dot red"></span>Disconnected</div>
      </div>
      <div class="status-card">
        <div class="label">iPad Clients</div>
        <div class="value" id="client-count">0</div>
      </div>
    </div>
    <div class="info">
      iPad editor: <code>http://&lt;your-ip&gt;:5173</code>
    </div>
  </body>
</html>
